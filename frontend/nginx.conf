# =====================================================================================================
# nginx del frontend Salary Manager (blocco server, incluso da /etc/nginx/nginx.conf dell'immagine ufficiale).
# E' un template: all'avvio del container la variabile SAM_BACKEND_URL viene sostituita con il suo valore
# (envsubst dell'immagine nginx, solo per le variabili d'ambiente definite: le variabili di nginx restano intatte).
# =====================================================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Caricamento multiplo dei cedolini: allineato a spring.servlet.multipart.max-request-size (500MB);
    # il limite per singolo PDF (25MB) lo applica il backend
    client_max_body_size 500m;
    client_body_timeout 300s;

    # Compressione delle risorse testuali (anche delle risposte JSON del backend)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/problem+json
        application/xml
        image/svg+xml;

    # Impostazioni comuni dei proxy verso il backend (ereditate dalle location che non ne definiscono altre)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upload inoltrati al backend man mano che arrivano, senza copia temporanea su disco
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # API REST
    location /api/ {
        proxy_pass ${SAM_BACKEND_URL};
    }

    # Documentazione OpenAPI generata e Swagger UI (/swagger-ui.html, /swagger-ui/...)
    location /v3/api-docs {
        proxy_pass ${SAM_BACKEND_URL};
    }

    location /swagger-ui {
        proxy_pass ${SAM_BACKEND_URL};
    }

    # Asset di Vite con hash nel nome: immutabili, cache di un anno. Un file mancante e' un 404, non la SPA.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: ogni altro percorso che non e' un file restituisce index.html (routing lato client).
    # index.html e i file di public/ (es. logo.png) si rivalidano sempre: un nuovo rilascio o un logo
    # sostituito sono visibili subito.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
